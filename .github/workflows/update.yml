name: Check for Updates

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to update to (optional)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    env:
      NU_VERSION: "0.114.1"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nushell
        run: |
          set -euo pipefail
          asset="nu-${NU_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${asset}"
          mkdir -p "$RUNNER_TEMP/nu" "$RUNNER_TOOL_CACHE/nu/bin"
          curl --fail --location --show-error --silent "$url" --output "$RUNNER_TEMP/nu/$asset"
          tar -xzf "$RUNNER_TEMP/nu/$asset" -C "$RUNNER_TEMP/nu"
          find "$RUNNER_TEMP/nu" -type f -name nu -perm -u+x -exec cp {} "$RUNNER_TOOL_CACHE/nu/bin/nu" \; -quit
          echo "$RUNNER_TOOL_CACHE/nu/bin" >> "$GITHUB_PATH"

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for new version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        shell: nu {0}
        run: |
          if ($env.REQUESTED_VERSION | is-not-empty) {
            ./scripts/check-latest-version.nu --version $env.REQUESTED_VERSION | save --append $env.GITHUB_OUTPUT
          } else {
            ./scripts/check-latest-version.nu | save --append $env.GITHUB_OUTPUT
          }

      - name: Update version
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
        shell: nu {0}
        run: |
          ./scripts/update.nu --version $env.NEW_VERSION

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update zed to version ${{ steps.check.outputs.new_version }}"
          title: "chore: update zed to version ${{ steps.check.outputs.new_version }}"
          body: |
            ## Update Zed

            This PR updates Zed from version ${{ steps.check.outputs.current_version }} to ${{ steps.check.outputs.new_version }}.

            ### Changes
            - Updated `version` in `package.nix`
            - Updated the prebuilt Zed tarball hash

            ### Checklist
            - [ ] Build passes
            - [ ] Basic functionality tested

            ---
            *This PR was automatically generated by the update workflow.*
          branch: update-zed-${{ steps.check.outputs.new_version }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable Auto-Merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: nu {0}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch

      - name: Summary
        if: always()
        shell: nu {0}
        run: |
          def append-summary [lines: list<string>] {
            let text = ($lines | str join "\n")
            ($text + "\n") | save --append $env.GITHUB_STEP_SUMMARY
          }

          append-summary ["## Update Summary" ""]

          if "${{ steps.check.outputs.update_needed }}" == "true" {
            append-summary [
              "- **Current Version:** ${{ steps.check.outputs.current_version }}"
              "- **Latest Version:** ${{ steps.check.outputs.new_version }}"
              ""
              "Pull request created for version update with auto-merge enabled."
            ]
          } else {
            let current_version = (
              open --raw package.nix
              | parse --regex 'version = "(?P<version>[^"]+)"'
              | get version
              | first
            )
            append-summary [
              $"- **Current Version:** ($current_version)"
              ""
              "Already up to date."
            ]
          }
