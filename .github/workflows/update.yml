name: Check for Updates

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to update to (optional)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for new version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ./scripts/check-latest-version.sh --version "${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            ./scripts/check-latest-version.sh >> $GITHUB_OUTPUT
          fi

      - name: Update version
        if: steps.check.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.check.outputs.new_version }}"
          ./scripts/update.sh --version "$NEW_VERSION"

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update zed to version ${{ steps.check.outputs.new_version }}"
          title: "chore: update zed to version ${{ steps.check.outputs.new_version }}"
          body: |
            ## Update Zed

            This PR updates Zed from version ${{ steps.check.outputs.current_version }} to ${{ steps.check.outputs.new_version }}.

            ### Changes
            - Updated `version` in `package.nix`
            - Updated native binary hashes for all platforms
            - Updated npm tarball hash

            ### Checklist
            - [ ] Build passes
            - [ ] Basic functionality tested

            ---
            *This PR was automatically generated by the update workflow.*
          branch: update-zed-${{ steps.check.outputs.new_version }}
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Enable Auto-Merge
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --auto --squash --delete-branch

      - name: Summary
        if: always()
        run: |
          echo "## Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.update_needed }}" == "true" ]; then
            echo "- **Current Version:** ${{ steps.check.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Latest Version:** ${{ steps.check.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Pull request created for version update with auto-merge enabled!" >> $GITHUB_STEP_SUMMARY
          else
            CURRENT_VERSION=$(grep 'version = ' package.nix | cut -d'"' -f2 | head -1)
            echo "- **Current Version:** $CURRENT_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Already up to date!" >> $GITHUB_STEP_SUMMARY
          fi
